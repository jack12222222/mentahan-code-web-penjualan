      updateCartUI();
    }

    function toggleCart(forceOpen) {
      const cartModal = document.getElementById("cart-modal");
      const cartOverlay = document.getElementById("cart-overlay");

      const shouldOpen = typeof forceOpen === "boolean"
        ? forceOpen
        : !cartModal.classList.contains("open");

      cartModal.classList.toggle("open", shouldOpen);
      cartOverlay.classList.toggle("show", shouldOpen);
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Keranjang belanja Anda masih kosong.");
        return;
      }

      let message = "Halo, apakah barang ini masi tersedia
:\n\n";
      cart.forEach((item, index) => {
        message += `${index + 1}. ${item.name} (${item.quantity}x) - ${formatRupiah(item.price * item.quantity)}\n`;
      });

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      message += `\n*Total Pembayaran: ${formatRupiah(total)}*`;

      const whatsappURL = `https://wa.me/6289502371441?text=${encodeURIComponent(message)}`;
      window.open(whatsappURL, "_blank");
    }

    renderProducts(products);
    updateCartUI();
  </script>
</body>
</html>
