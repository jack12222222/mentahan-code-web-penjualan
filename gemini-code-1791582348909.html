<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Online Saya</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding-bottom: 60px;
    }

    /* Header & Navigation */
    header {
      background-color: #1e293b;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .cart-btn {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background-color: #0369a1;
    }

    /* Main Layout */
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .categories {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .category-btn {
      background-color: #e2e8f0;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
    }

    .category-btn.active {
      background-color: #0284c7;
      color: white;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #cbd5e1;
    }

    .product-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-size: 1.2rem;
      color: #0284c7;
      font-weight: bold;
      margin-bottom: 1rem;
      margin-top: auto;
    }

    .add-to-cart-btn {
      width: 100%;
      background-color: #10b981;
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .add-to-cart-btn:hover {
      background-color: #059669;
    }

    /* Cart Sidebar / Modal */
    .cart-modal {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100%;
      background: white;
      box-shadow: -4px 0 10px rgba(0,0,0,0.1);
      transition: right 0.3s ease;
      z-index: 200;
      display: flex;
      flex-direction: column;
    }

    .cart-modal.open {
      right: 0;
    }

    .cart-header {
      padding: 1.5rem;
      background: #1e293b;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-cart {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      padding: 1rem;
      overflow-y: auto;
      flex-grow: 1;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .cart-footer {
      padding: 1.5rem;
      border-top: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    .total-price {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
    }

    .checkout-btn {
      width: 100%;
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">TokoKita</div>
    <button class="cart-btn" onclick="toggleCart()">
      Keranjang (<span id="cart-count">0</span>)
    </button>
  </header>

  <!-- Content Container -->
  <div class="container">
    <!-- Filter Kategori -->
    <div class="categories">
      <button class="category-btn active" onclick="filterProducts('all', this)">Semua</button>
      <button class="category-btn" onclick="filterProducts('Elektronik', this)">Elektronik</button>
      <button class="category-btn" onclick="filterProducts('Pakaian', this)">Pakaian</button>
      <button class="category-btn" onclick="filterProducts('Aksesoris', this)">Aksesoris</button>
    </div>

    <!-- Grid Produk -->
    <div class="product-grid" id="product-grid"></div>
  </div>

  <!-- Cart Modal -->
  <div class="cart-modal" id="cart-modal">
    <div class="cart-header">
      <h2>Keranjang Belanja</h2>
      <button class="close-cart" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p style="color: #64748b;">Keranjang Anda masih kosong.</p>
    </div>
    <div class="cart-footer">
      <div class="total-price">
        <span>Total:</span>
        <span id="cart-total">Rp 0</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Checkout (WhatsApp)</button>
    </div>
  </div>

  <script>
    // Data Produk Contoh
    const products = [
      { id: 1, name: "Headphone Bluetooth", category: "Elektronik", price: 350000, image: "https://via.placeholder.com/250x180?text=Headphone" },
      { id: 2, name: "Kaos Polos Cotton", category: "Pakaian", price: 75000, image: "https://via.placeholder.com/250x180?text=Kaos+Polos" },
      { id: 3, name: "Jam Tangan Casual", category: "Aksesoris", price: 250000, image: "https://via.placeholder.com/250x180?text=Jam+Tangan" },
      { id: 4, name: "Mouse Wireless", category: "Elektronik", price: 120000, image: "https://via.placeholder.com/250x180?text=Mouse" },
      { id: 5, name: "Jaket Denim", category: "Pakaian", price: 220000, image: "https://via.placeholder.com/250x180?text=Jaket+Denim" },
      { id: 6, name: "Kacamata Hitam", category: "Aksesoris", price: 85000, image: "https://via.placeholder.com/250x180?text=Kacamata" }
    ];

    let cart = [];

    // Format mata uang Rupiah
    function formatRupiah(amount) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
    }

    // Tampilkan Produk
    function renderProducts(items) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = items.map(product => `
        <div class="product-card">
          <img src="${product.image}" alt="${product.name}" class="product-image">
          <div class="product-info">
            <div class="product-title">${product.name}</div>
            <div class="product-price">${formatRupiah(product.price)}</div>
            <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Tambah ke Keranjang</button>
          </div>
        </div>
      `).join('');
    }

    // Filter Produk berdasarkan Kategori
    function filterProducts(category, btnElement) {
      document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      if (category === 'all') {
        renderProducts(products);
      } else {
        const filtered = products.filter(p => p.category === category);
        renderProducts(filtered);
      }
    }

    // Tambahkan Produk ke Keranjang
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCartUI();
    }

    // Update Tampilan Keranjang
    function updateCartUI() {
      const cartCount = document.getElementById('cart-count');
      const cartItems = document.getElementById('cart-items');
      const cartTotal = document.getElementById('cart-total');

      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      cartCount.textContent = totalCount;
      cartTotal.textContent = formatRupiah(totalPrice);

      if (cart.length === 0) {
        cartItems.innerHTML = '<p style="color: #64748b;">Keranjang Anda masih kosong.</p>';
        return;
      }

      cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong><br>
            <small>${formatRupiah(item.price)} x ${item.quantity}</small>
          </div>
          <div>
            <span>${formatRupiah(item.price * item.quantity)}</span>
            <button onclick="removeFromCart(${item.id})" style="color: red; border: none; background: none; margin-left: 8px; cursor: pointer;">&times;</button>
          </div>
        </div>
      `).join('');
    }

    // Hapus Barang dari Keranjang
    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartUI();
    }

    // Buka/Tutup Modal Keranjang
    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('open');
    }

    // Simulasi Checkout via WhatsApp
    function checkout() {
      if (cart.length === 0) {
        alert("Keranjang belanja Anda masih kosong.");
        return;
      }

      let message = "Halo, saya ingin memesan produk berikut:\n\n";
      cart.forEach((item, index) => {
        message += `${index + 1}. ${item.name} (${item.quantity}x) - ${formatRupiah(item.price * item.quantity)}\n`;
      });
      
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      message += `\n*Total Pembayaran: ${formatRupiah(total)}*`;

      const whatsappURL = `https://wa.me/6281234567890?text=${encodeURIComponent(message)}`;
      window.open(whatsappURL, '_blank');
    }

    // Inisialisasi awal
    renderProducts(products);
  </script>
</body>
</html>
